<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinozauru spēle</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #0d2404d8;
  color: #ffffff;
}

h1 {font: size 36px; Text-align: center;
  color: #ffffff;
}

.noteikumi {
  background-color: #38630f;
  color: #ffffff;
  padding: 20px;
  border-radius: 12px;
}

.laukums {
  width: 360px;
  padding: 12px;
  border: 2px dashed #2c8a00;
  background-color: #36570b;
  box-sizing: border-box;
  margin: 20px auto; max-width: 100%; text-align: center;
}

button {
  background-color: #387a19;
  color: #ffffff;
  border-radius: 8px;
}
</style>
</head>
<body>
<h1>Dinozauru spēle</h1>
<p>Izvairies no meteoriem un tiec cik vien tālu tu vari</p>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Punktus tu iegūsti tiekot tālu</p>
  <p>Skaņas efekts nozīmē, ka tu esi palēcies</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="atteli/varonis.png" alt="Spēles varonis" width="128">
  <p>Skaņas efekta nozīme spēlē:</p>
  <audio controls src="skanas/Jump.mp3"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">Savākt punktu</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
